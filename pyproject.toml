[project]
name = "redline"
version = "0.1.0"
description = "Reads a document set against a rulebook and cites every place the rules aren't satisfied."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.100",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]
